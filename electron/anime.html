<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Kuro Anime</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    #0b0b0f;

  color:
    #fff;

  overflow:
    hidden;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {

  height:
    62px;

  display:
    flex;

  align-items:
    center;

  gap:
    18px;

  padding:
    0 20px;

  background:
    #101016;

  border-bottom:
    1px solid #292932;
}

.back {

  border:
    0;

  background:
    transparent;

  color:
    #fff;

  font-size:
    14px;

  cursor:
    pointer;
}

.back:hover {

  color:
    #9b5cff;
}

.logo {

  font-size:
    22px;

  font-weight:
    700;

  white-space:
    nowrap;
}

.logo span {

  color:
    #9b5cff;
}

.search {

  width:
    300px;

  height:
    38px;

  margin-left:
    10px;

  padding:
    0 14px;

  background:
    #17171f;

  border:
    1px solid #292934;

  border-radius:
    22px;

  outline:
    none;

  color:
    #fff;
}

.search:focus {

  border-color:
    #9b5cff;
}


/* =========================================================
   PAGE
   ========================================================= */

.page {

  width:
    100%;

  height:
    calc(100vh - 62px);

  padding:
    18px;

  overflow:
    hidden;
}


/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {

  height:
    42px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  margin-bottom:
    12px;
}

.title {

  font-size:
    22px;

  font-weight:
    700;

  white-space:
    nowrap;

  overflow:
    hidden;

  text-overflow:
    ellipsis;
}

.episode-count {

  color:
    #9999a5;

  font-size:
    13px;
}


/* =========================================================
   MAL BAR
   ========================================================= */

.mal-bar {

  height:
    54px;

  margin-bottom:
    12px;

  display:
    flex;

  align-items:
    center;

  gap:
    10px;

  padding:
    0 12px;

  background:
    #111117;

  border:
    1px solid #292932;

  border-radius:
    10px;
}

.mal-label {

  color:
    #9b5cff;

  font-weight:
    700;

  font-size:
    12px;
}

.mal-status-text {

  color:
    #aaaab5;

  font-size:
    12px;

  margin-right:
    auto;

  overflow:
    hidden;

  text-overflow:
    ellipsis;

  white-space:
    nowrap;
}

.mal-bar select,
.mal-bar button {

  height:
    30px;

  background:
    #17171f;

  color:
    #fff;

  border:
    1px solid #2c2c37;

  border-radius:
    6px;

  padding:
    0 8px;

  font-size:
    11px;

  outline:
    none;
}

.mal-bar button {

  cursor:
    pointer;

  font-weight:
    700;
}

.mal-bar button:hover {

  border-color:
    #9b5cff;

  background:
    #21182f;
}

.mal-bar button.primary {

  background:
    #9255ee;

  border-color:
    #9255ee;
}

.mal-bar button.danger {

  color:
    #ef4444;

  border-color:
    #6d252c;
}

.mal-bar button.danger:hover {

  color:
    #fff;

  background:
    #35151a;

  border-color:
    #ef4444;
}

.mal-bar button:disabled,
.mal-bar select:disabled {

  opacity:
    0.5;

  cursor:
    not-allowed;
}


/* =========================================================
   WATCH LAYOUT
   ========================================================= */

.watch-layout {

  width:
    100%;

  height:
    calc(100% - 108px);

  display:
    grid;

  grid-template-columns:
    minmax(0, 1fr) 262px;

  gap:
    14px;
}


/* =========================================================
   PLAYER CARD
   ========================================================= */

.player-card {

  min-width:
    0;

  height:
    100%;

  background:
    #111117;

  border:
    1px solid #292932;

  border-radius:
    10px;

  overflow:
    hidden;
}

.player-head {

  height:
    40px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  padding:
    0 13px;

  border-bottom:
    1px solid #292932;

  font-size:
    13px;

  font-weight:
    700;
}

.player-controls {

  display:
    flex;

  gap:
    6px;
}

.player-control {

  height:
    30px;

  padding:
    0 10px;

  background:
    #17171f;

  border:
    1px solid #343440;

  border-radius:
    6px;

  color:
    #fff;

  font-size:
    11px;

  font-weight:
    700;

  cursor:
    pointer;
}

.player-control:hover {

  border-color:
    #9b5cff;

  background:
    #21182f;
}


/* =========================================================
   PLAYER
   ========================================================= */

.player {

  position:
    relative;

  width:
    100%;

  height:
    calc(100% - 40px);

  background:
    #000;

  overflow:
    hidden;
}

#anichiPlayer {

  position:
    absolute;

  left:
    0;

  top:
    0;

  width:
    100%;

  height:
    100%;

  border:
    0;

  background:
    #000;
}


/* =========================================================
   PLAYER PLACEHOLDER
   ========================================================= */

.player-placeholder {

  position:
    absolute;

  inset:
    0;

  z-index:
    20;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  background:
    #000;

  color:
    #777782;

  font-size:
    14px;
}

.player-placeholder.hidden {

  display:
    none;
}


/* =========================================================
   PLAYER ERROR
   ========================================================= */

.player-error {

  position:
    absolute;

  inset:
    0;

  z-index:
    30;

  display:
    none;

  align-items:
    center;

  justify-content:
    center;

  flex-direction:
    column;

  background:
    #000;

  text-align:
    center;

  padding:
    20px;
}

.player-error.show {

  display:
    flex;
}

.error-icon {

  width:
    54px;

  height:
    54px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  margin-bottom:
    14px;

  border:
    1px solid #6733aa;

  border-radius:
    50%;

  color:
    #9b5cff;

  font-size:
    22px;
}

.error-title {

  margin-bottom:
    8px;

  font-weight:
    700;
}

.error-message {

  max-width:
    450px;

  color:
    #777782;

  font-size:
    12px;
}


/* =========================================================
   EPISODES
   ========================================================= */

.episodes-card {

  width:
    262px;

  height:
    100%;

  background:
    #111117;

  border:
    1px solid #292932;

  border-radius:
    10px;

  overflow:
    hidden;
}

.episodes-head {

  height:
    42px;

  display:
    flex;

  align-items:
    center;

  padding:
    0 13px;

  border-bottom:
    1px solid #292932;

  font-size:
    14px;

  font-weight:
    700;
}

.episode-search {

  padding:
    9px;
}

.episode-search input {

  width:
    100%;

  height:
    31px;

  padding:
    0 10px;

  background:
    #17171f;

  border:
    1px solid #2c2c37;

  border-radius:
    6px;

  outline:
    none;

  color:
    #fff;

  font-size:
    12px;
}

.episodes {

  height:
    calc(100% - 82px);

  padding:
    0 9px 12px;

  display:
    grid;

  grid-template-columns:
    repeat(3, 1fr);

  grid-auto-rows:
    36px;

  gap:
    7px;

  align-content:
    start;

  overflow-y:
    auto;
}

.episode {

  width:
    100%;

  height:
    36px;

  background:
    #17171f;

  border:
    1px solid #2a2a35;

  border-radius:
    6px;

  color:
    #e8e8ee;

  font-size:
    12px;

  cursor:
    pointer;
}

.episode:hover {

  border-color:
    #9154ef;

  background:
    #202027;
}

.episode.active {

  background:
    #9255ee;

  border-color:
    #9255ee;
}

.episode.hidden {

  display:
    none;
}

.loading,
.error {

  grid-column:
    1 / -1;

  padding:
    20px;

  text-align:
    center;
}

.loading {

  color:
    #777782;
}

.error {

  color:
    #ef4444;
}


/* =========================================================
   SCROLLBAR
   ========================================================= */

::-webkit-scrollbar {

  width:
    7px;
}

::-webkit-scrollbar-track {

  background:
    #101016;
}

::-webkit-scrollbar-thumb {

  background:
    #30303a;

  border-radius:
    10px;
}


/* =========================================================
   CINEMA MODE
   ========================================================= */

body.cinema-mode {

  overflow:
    hidden;
}

body.cinema-mode .header,
body.cinema-mode .topbar,
body.cinema-mode .mal-bar,
body.cinema-mode .episodes-card {

  display:
    none;
}

body.cinema-mode .page {

  height:
    100vh;

  padding:
    0;
}

body.cinema-mode .watch-layout {

  height:
    100vh;

  display:
    block;
}

body.cinema-mode .player-card {

  height:
    100vh;

  border:
    0;

  border-radius:
    0;
}

body.cinema-mode .player {

  height:
    calc(100vh - 40px);
}


/* =========================================================
   PLAYER-ONLY FULLSCREEN
   ========================================================= */

body.player-fullscreen {

  overflow:
    hidden;
}

body.player-fullscreen .header,
body.player-fullscreen .topbar,
body.player-fullscreen .mal-bar,
body.player-fullscreen .episodes-card {

  display:
    none;
}

body.player-fullscreen .page {

  width:
    100vw;

  height:
    100vh;

  padding:
    0;
}

body.player-fullscreen .watch-layout {

  width:
    100vw;

  height:
    100vh;

  display:
    block;
}

body.player-fullscreen .player-card {

  width:
    100vw;

  height:
    100vh;

  border:
    0;

  border-radius:
    0;
}

body.player-fullscreen .player-head {

  display:
    none;
}

body.player-fullscreen .player {

  width:
    100vw;

  height:
    100vh;
}

body.player-fullscreen #anichiPlayer {

  width:
    100vw;

  height:
    100vh;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (
  max-width: 800px
) {

  .search {

    width:
      220px;
  }

  .mal-status-text {

    display:
      none;
  }

  .watch-layout {

    grid-template-columns:
      minmax(0, 1fr) 220px;
  }

  .episodes-card {

    width:
      220px;
  }
}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="header">

  <button
    class="back"
    onclick="history.back()"
  >
    ← Back
  </button>

  <div class="logo">
    Kuro <span>Anime</span>
  </div>

  <input
    id="searchInput"
    class="search"
    type="text"
    placeholder="Search anime..."
    autocomplete="off"
  >

</header>


<!-- =========================================================
     PAGE
     ========================================================= -->

<main class="page">


  <div class="topbar">

    <h1
      id="animeTitle"
      class="title"
    >
      Loading...
    </h1>

    <div
      id="episodeCount"
      class="episode-count"
    >
      Loading...
    </div>

  </div>


  <!-- =======================================================
       MAL BAR
       ======================================================= -->

  <div class="mal-bar">

    <span class="mal-label">
      MAL
    </span>

    <span
      id="malStatusText"
      class="mal-status-text"
    >
      Checking MyAnimeList...
    </span>

    <select
      id="malListStatus"
    >

      <option value="watching">
        Watching
      </option>

      <option value="completed">
        Completed
      </option>

      <option value="on_hold">
        On Hold
      </option>

      <option value="dropped">
        Dropped
      </option>

      <option value="plan_to_watch">
        Plan to Watch
      </option>

    </select>


    <select
      id="malScore"
    >

      <option value="0">
        Score 0
      </option>

      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10</option>

    </select>


    <button
      id="malMarkWatched"
    >
      Mark Watched
    </button>


    <button
      id="malSave"
      class="primary"
    >
      Save MAL
    </button>

    <button
      id="malRemove"
    >
      Remove
    </button>


    <button
      id="malLoginButton"
    >
      Login with MAL
    </button>

  </div>


  <!-- =======================================================
       WATCH LAYOUT
       ======================================================= -->

  <div class="watch-layout">


    <!-- PLAYER -->

    <section class="player-card">

      <div class="player-head">

        <span>
          AniChi Player
        </span>

        <div class="player-controls">

          <button
            id="cinemaButton"
            class="player-control"
          >
            Cinema
          </button>

          <button
            id="fullscreenButton"
            class="player-control"
          >
            Fullscreen
          </button>

        </div>

      </div>


      <div class="player">

        <div
          id="playerPlaceholder"
          class="player-placeholder"
        >
          Select an episode to start watching.
        </div>


        <webview
          id="anichiPlayer"
          partition="persist:anichi"
          allowpopups
          webpreferences="contextIsolation=yes,nodeIntegration=no"
        ></webview>


        <div
          id="playerError"
          class="player-error"
        >

          <div class="error-icon">
            !
          </div>

          <div class="error-title">
            Player Error
          </div>

          <div
            id="playerErrorMessage"
            class="error-message"
          >
            Unable to load AniChi.
          </div>

        </div>

      </div>

    </section>


    <!-- EPISODES -->

    <aside class="episodes-card">

      <div class="episodes-head">
        Episodes
      </div>

      <div class="episode-search">

        <input
          id="episodeSearch"
          type="text"
          placeholder="Find episode..."
          autocomplete="off"
        >

      </div>

      <div
        id="episodes"
        class="episodes"
      >

        <div class="loading">
          Loading episodes...
        </div>

      </div>

    </aside>

  </div>

</main>


<script>


// ============================================================
// URL PARAMETERS
// ============================================================

const params =
  new URLSearchParams(
    location.search
  );

const animeId =
  params.get(
    'id'
  );

const animeTitleParam =
  params.get(
    'title'
  );


// ============================================================
// DOM ELEMENTS
// ============================================================

const animeTitle =
  document.getElementById(
    'animeTitle'
  );

const episodeCount =
  document.getElementById(
    'episodeCount'
  );

const episodesContainer =
  document.getElementById(
    'episodes'
  );

const searchInput =
  document.getElementById(
    'searchInput'
  );

const episodeSearch =
  document.getElementById(
    'episodeSearch'
  );

const player =
  document.getElementById(
    'anichiPlayer'
  );

const playerPlaceholder =
  document.getElementById(
    'playerPlaceholder'
  );

const playerError =
  document.getElementById(
    'playerError'
  );

const playerErrorMessage =
  document.getElementById(
    'playerErrorMessage'
  );


// MAL

const malStatusText =
  document.getElementById(
    'malStatusText'
  );

const malListStatus =
  document.getElementById(
    'malListStatus'
  );

const malScore =
  document.getElementById(
    'malScore'
  );

const malMarkWatched =
  document.getElementById(
    'malMarkWatched'
  );

const malSave =
  document.getElementById(
    'malSave'
  );

const malRemove =
  document.getElementById(
    'malRemove'
  );

const malLoginButton =
  document.getElementById(
    'malLoginButton'
  );


// PLAYER BUTTONS

const cinemaButton =
  document.getElementById(
    'cinemaButton'
  );

const fullscreenButton =
  document.getElementById(
    'fullscreenButton'
  );


// ============================================================
// STATE
// ============================================================

let episodeList =
  [];

let currentEpisode =
  null;

let malAnime =
  null;

let malLoggedIn =
  false;

let cinemaMode =
  false;

let playerFullscreen =
  false;


// ============================================================
// TITLE HELPERS
// ============================================================

function formatTitle(
  value
) {

  if (!value) {
    return 'Anime';
  }

  return value
    .replace(
      /-/g,
      ' '
    )
    .replace(
      /\b\w/g,
      c =>
        c.toUpperCase()
    );
}


function escapeHtml(
  text
) {

  return String(
    text || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );
}


// ============================================================
// HEADER SEARCH
// ============================================================

searchInput.onkeydown =
  event => {

    if (
      event.key !==
      'Enter'
    ) {

      return;
    }

    const query =
      searchInput.value.trim();

    if (!query) {
      return;
    }

    location.href =
      `index.html?search=${encodeURIComponent(query)}`;
  };


// ============================================================
// MAL ENABLE/DISABLE
// ============================================================

function setMalEnabled(
  enabled
) {

  malListStatus.disabled =
    !enabled;

  malScore.disabled =
    !enabled;

  malMarkWatched.disabled =
    !enabled;

  malSave.disabled =
    !enabled;

  malRemove.disabled =
    !enabled;
}


// ============================================================
// LOAD MAL
// ============================================================

async function loadMalForAnime() {

  try {

    const status =
      await window.kuroAPI.malStatus();

    malLoggedIn =
      !!status?.loggedIn;

    malLoginButton.textContent =
      malLoggedIn
        ? 'Logout'
        : 'Login with MAL';


    const title =
      animeTitleParam ||
      formatTitle(
        animeId
      );


    const result =
      await window.kuroAPI.malLinkAnime(
        title
      );


    if (
      !result?.success ||
      !result.data
    ) {

      malStatusText.textContent =
        result?.error ||
        'Could not match this anime on MAL.';

      setMalEnabled(
        false
      );

      return;
    }


    malAnime =
      result.data;


    const listStatus =
      malAnime.my_list_status ||
      null;


    malStatusText.textContent =
      `${malAnime.title} • MAL #${malAnime.id} • ${malAnime.num_episodes || '?'} eps`;


    if (
      listStatus
    ) {

      malListStatus.value =
        listStatus.status ||
        'plan_to_watch';

      malScore.value =
        String(
          listStatus.score ||
          0
        );

      malStatusText.textContent +=
        ` • ${String(listStatus.status || '').replaceAll('_', ' ')} • ${listStatus.num_episodes_watched || 0} watched`;

    } else {

      malListStatus.value =
        'plan_to_watch';

      malScore.value =
        '0';
    }


    if (
      !malLoggedIn
    ) {

      malStatusText.textContent +=
        ' • Login to sync your list';
    }


    setMalEnabled(
      malLoggedIn
    );

  } catch (error) {

    console.error(
      error
    );

    malStatusText.textContent =
      'MAL error: ' +
      error.message;

    setMalEnabled(
      false
    );
  }
}


// ============================================================
// SAVE MAL
// ============================================================

async function saveMalStatus(
  episodeNumber = null
) {

  if (
    !malAnime?.id
  ) {

    alert(
      'Login to MAL and link the anime first.'
    );

    return;
  }


  const update = {

    status:
      malListStatus.value,

    score:
      Number(
        malScore.value
      )
  };


  if (
    episodeNumber !== null
  ) {

    update.num_watched_episodes =
      Number(
        episodeNumber
      );

  } else if (
    malAnime.my_list_status
  ) {

    update.num_watched_episodes =
      Number(
        malAnime
          .my_list_status
          .num_episodes_watched ||
        0
      );
  }


  try {

    malSave.disabled =
      true;

    malMarkWatched.disabled =
      true;


    const result =
      await window.kuroAPI.malUpdateAnime(
        malAnime.id,
        update
      );


    if (
      !result?.success
    ) {

      throw new Error(
        result?.error ||
        'MAL update failed.'
      );
    }


    await loadMalForAnime();

  } catch (error) {

    console.error(
      error
    );

    alert(
      error.message
    );

  } finally {

    if (
      malLoggedIn &&
      malAnime
    ) {

      setMalEnabled(
        true
      );
    }
  }
}


// ============================================================
// MAL REMOVE
// ============================================================

async function removeMalAnime() {

  if (!malAnime?.id) {
    alert(
      'Login to MAL and link the anime first.'
    );
    return;
  }

  if (
    !confirm(
      'Remove this anime from your MyAnimeList list?'
    )
  ) {
    return;
  }

  try {

    malRemove.disabled = true;
    malRemove.textContent = 'Removing...';

    const result =
      await window.kuroAPI.malRemoveAnime(
        malAnime.id
      );

    if (!result?.success) {
      throw new Error(
        result?.error ||
        'MAL remove failed.'
      );
    }

    malListStatus.value =
      'plan_to_watch';

    malScore.value =
      '0';

    malStatusText.textContent =
      `${malAnime.title} • MAL #${malAnime.id} • Removed from your list`;

    malRemove.textContent =
      'Removed ✓';

    setTimeout(
      () => {
        malRemove.textContent =
          'Remove';
      },
      1200
    );

  } catch (error) {

    console.error(
      'MAL remove error:',
      error
    );

    alert(
      error.message
    );

    malRemove.textContent =
      'Remove';

  } finally {

    setMalEnabled(
      malLoggedIn &&
      !!malAnime
    );
  }
}


// ============================================================
// MAL LOGIN / LOGOUT
// ============================================================

malLoginButton.onclick =
  async () => {

    try {

      if (
        malLoggedIn
      ) {

        await window.kuroAPI.malLogout();

        malAnime =
          null;

        malLoggedIn =
          false;

        await loadMalForAnime();

        return;
      }


      malLoginButton.disabled =
        true;

      malLoginButton.textContent =
        'Opening MAL...';


      const result =
        await window.kuroAPI.malLogin();


      if (
        !result?.success
      ) {

        alert(
          result?.error ||
          'MAL login failed.'
        );
      }


      await loadMalForAnime();

    } catch (error) {

      alert(
        error.message
      );

    } finally {

      malLoginButton.disabled =
        false;
    }
  };


malSave.onclick =
  () =>
    saveMalStatus();

malRemove.onclick =
  () =>
    removeMalAnime();


malMarkWatched.onclick =
  () => {

    if (
      !currentEpisode
    ) {

      alert(
        'Start an episode first.'
      );

      return;
    }

    saveMalStatus(
      Number(
        currentEpisode.number
      )
    );
  };


// ============================================================
// CINEMA MODE
// ============================================================

function enterCinemaMode() {

  cinemaMode =
    true;

  document.body.classList.add(
    'cinema-mode'
  );

  cinemaButton.textContent =
    'Exit Cinema';
}


function exitCinemaMode() {

  cinemaMode =
    false;

  document.body.classList.remove(
    'cinema-mode'
  );

  cinemaButton.textContent =
    'Cinema';
}


// ============================================================
// PLAYER-ONLY FULLSCREEN
// ============================================================

function enterPlayerFullscreen() {

  playerFullscreen =
    true;

  exitCinemaMode();

  document.body.classList.add(
    'player-fullscreen'
  );

  fullscreenButton.textContent =
    'Exit Fullscreen';
}


function exitPlayerFullscreen() {

  playerFullscreen =
    false;

  document.body.classList.remove(
    'player-fullscreen'
  );

  fullscreenButton.textContent =
    'Fullscreen';
}


function togglePlayerFullscreen() {

  if (
    playerFullscreen
  ) {

    exitPlayerFullscreen();

  } else {

    enterPlayerFullscreen();
  }
}


// ============================================================
// PLAYER BUTTONS
// ============================================================

cinemaButton.onclick =
  () => {

    if (
      cinemaMode
    ) {

      exitCinemaMode();

    } else {

      enterCinemaMode();
    }
  };


fullscreenButton.onclick =
  () =>
    togglePlayerFullscreen();


// ============================================================
// F11 FROM MAIN PROCESS
// ============================================================

if (
  window.kuroAPI &&
  typeof window.kuroAPI
    .onPlayerFullscreenToggle ===
    'function'
) {

  window.kuroAPI
    .onPlayerFullscreenToggle(
      () => {

        togglePlayerFullscreen();
      }
    );
}


// ============================================================
// ESC FROM MAIN PROCESS
// ============================================================

if (
  window.kuroAPI &&
  typeof window.kuroAPI
    .onPlayerFullscreenExit ===
    'function'
) {

  window.kuroAPI
    .onPlayerFullscreenExit(
      () => {

        if (
          playerFullscreen
        ) {

          exitPlayerFullscreen();

          return;
        }


        if (
          cinemaMode
        ) {

          exitCinemaMode();
        }
      }
    );
}


// ============================================================
// NORMAL PAGE ESC
// ============================================================

document.addEventListener(
  'keydown',
  event => {

    if (
      event.key !==
      'Escape'
    ) {

      return;
    }


    if (
      playerFullscreen
    ) {

      event.preventDefault();

      exitPlayerFullscreen();

      return;
    }


    if (
      cinemaMode
    ) {

      event.preventDefault();

      exitCinemaMode();
    }
  }
);


// ============================================================
// LOAD EPISODES
// ============================================================

async function loadEpisodes() {

  if (!animeId) {

    animeTitle.textContent =
      'Anime not found';

    episodeCount.textContent =
      '0 episodes';

    episodesContainer.innerHTML =
      '<div class="error">Missing anime ID.</div>';

    return;
  }


  animeTitle.textContent =
    animeTitleParam ||
    formatTitle(
      animeId
    );


  try {

    const result =
      await window.kuroAPI.getEpisodes(
        animeId
      );


    if (
      !result?.success
    ) {

      throw new Error(
        result?.error ||
        'Failed to load episodes.'
      );
    }


    episodeList =
      Array.isArray(
        result.data
      )
        ? result.data
        : [];


    episodeList.sort(
      (a, b) =>
        Number(a.number) -
        Number(b.number)
    );


    episodeCount.textContent =
      `${episodeList.length} episodes`;


    renderEpisodes();

  } catch (error) {

    episodeCount.textContent =
      'Failed to load';

    episodesContainer.innerHTML =
      `
      <div class="error">
        Failed to load episodes.
        <br><br>
        ${escapeHtml(error.message)}
      </div>
      `;
  }
}


// ============================================================
// RENDER EPISODES
// ============================================================

function renderEpisodes() {

  episodesContainer.innerHTML =
    '';


  if (
    !episodeList.length
  ) {

    episodesContainer.innerHTML =
      `
      <div class="error">
        No episodes found.
      </div>
      `;

    return;
  }


  episodeList.forEach(
    episode => {

      const button =
        document.createElement(
          'button'
        );

      button.className =
        'episode';

      button.textContent =
        episode.number;

      button.dataset.number =
        String(
          episode.number
        );

      button.title =
        episode.title ||
        `Episode ${episode.number}`;


      button.onclick =
        () =>
          playEpisode(
            episode,
            button
          );


      episodesContainer.appendChild(
        button
      );
    }
  );
}


// ============================================================
// PLAY EPISODE
// ============================================================

function playEpisode(
  episode,
  button
) {

  if (
    !episode?.url
  ) {

    return;
  }


  currentEpisode =
    episode;


  document
    .querySelectorAll(
      '.episode'
    )
    .forEach(
      element =>
        element.classList.remove(
          'active'
        )
    );


  button?.classList.add(
    'active'
  );


  playerError.classList.remove(
    'show'
  );

  playerPlaceholder.classList.remove(
    'hidden'
  );


  try {

    player.src =
      'about:blank';


    setTimeout(
      () => {

        if (
          currentEpisode !==
          episode
        ) {

          return;
        }

        player.src =
          episode.url;

      },
      150
    );

  } catch (error) {

    showPlayerError(
      error.message
    );
  }
}


// ============================================================
// ANICHI WEBVIEW ATTACHED
// ============================================================
//
// The main process now handles keyboard input directly from
// the guest WebContents, so this event is mainly for logging.
// ============================================================

player.addEventListener(
  'did-attach',
  () => {

    try {

      console.log(
        'AniChi webview attached:',
        player.getWebContentsId?.()
      );

    } catch (_) {}
  }
);


// ============================================================
// ANICHI DOM READY
// ============================================================

player.addEventListener(
  'dom-ready',
  () => {

    playerPlaceholder.classList.add(
      'hidden'
    );

    playerError.classList.remove(
      'show'
    );
  }
);


// ============================================================
// ANICHI STOP LOADING
// ============================================================

player.addEventListener(
  'did-stop-loading',
  () => {

    playerPlaceholder.classList.add(
      'hidden'
    );
  }
);


// ============================================================
// ANICHI LOAD ERROR
// ============================================================

player.addEventListener(
  'did-fail-load',
  event => {

    if (
      event.errorCode ===
      -3
    ) {

      return;
    }


    showPlayerError(
      `${event.errorDescription || 'Unable to load AniChi'} (${event.errorCode})`
    );
  }
);


// ============================================================
// ANICHI NEW WINDOW
// ============================================================

player.addEventListener(
  'new-window',
  event => {

    const url =
      event.url || '';


    if (
      url.startsWith(
        'https://anichi.to/'
      )
    ) {

      event.preventDefault();

      player.src =
        url;
    }
  }
);


// ============================================================
// ANICHI NAVIGATION
// ============================================================

player.addEventListener(
  'will-navigate',
  event => {

    console.log(
      'AniChi navigation:',
      event.url
    );
  }
);


// ============================================================
// PLAYER ERROR
// ============================================================

function showPlayerError(
  message
) {

  playerPlaceholder.classList.add(
    'hidden'
  );

  playerErrorMessage.textContent =
    message ||
    'Unknown AniChi player error';

  playerError.classList.add(
    'show'
  );
}


// ============================================================
// EPISODE SEARCH
// ============================================================

episodeSearch.oninput =
  () => {

    const query =
      episodeSearch.value
        .trim()
        .toLowerCase();


    document
      .querySelectorAll(
        '.episode'
      )
      .forEach(
        button => {

          const number =
            (
              button.dataset.number ||
              ''
            ).toLowerCase();

          const title =
            (
              button.title ||
              ''
            ).toLowerCase();


          button.classList.toggle(
            'hidden',

            !!query &&
            !number.includes(query) &&
            !title.includes(query)
          );
        }
      );
  };


// ============================================================
// START
// ============================================================

loadEpisodes();

loadMalForAnime();

</script>
